<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 留言板</title>
  <link rel="stylesheet" th:href="@{/css/starlight.css}">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
  <div class="container">
    <div class="nav-logo">留言板</div>
    <div class="nav-menu">
      <a th:href="@{/index}">首页广场</a>
      <a th:href="@{/login}" class="active">登录</a>
      <a th:href="@{/register}">注册</a>
    </div>
  </div>
</nav>

<main class="main">
  <div class="form-wrapper">
    <h2>用户登录</h2>

    <!-- 错误提示 -->
    <div class="error-msg" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" name="username" required placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" name="password" required placeholder="请输入密码">
      </div>
      <button type="submit" class="form-submit">登录</button>
    </form>

    <div class="form-tip">
      还没有账号？<a th:href="@{/register}">立即注册</a>
    </div>
  </div>
</main>

<script th:src="@{/js/starlight.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
