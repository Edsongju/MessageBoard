<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 留言板</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="form-wrapper">
  <h2>用户注册</h2>

  <div class="error-msg" th:if="${error}" th:text="${error}"></div>

  <form th:action="@{/register}" method="post">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="username" required placeholder="请设置用户名">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" required placeholder="请设置密码">
    </div>
    <div class="form-group">
      <label>确认密码</label>
      <input type="password" name="confirmPassword" required placeholder="请再次输入密码">
    </div>
    <button type="submit" class="form-submit">注册</button>
  </form>

  <div class="form-tip">
    已有账号？<a th:href="@{/login}">去登录</a>
  </div>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
