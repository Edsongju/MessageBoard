<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>注册 - 留言论坛</title>
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<canvas id="starBg"></canvas>

<div class="page-wrapper">
  <div class="login-card">
    <h2>创建账号</h2>
    <p class="sub-title">加入留言论坛，开始你的表达</p>

    <div th:if="${error != null}" class="error-msg" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
      <div class="form-item">
        <label>用户名</label>
        <input type="text" name="username" placeholder="请输入用户名" required>
      </div>
      <div class="form-item">
        <label>密码</label>
        <input type="password" name="password" placeholder="请输入密码" required>
      </div>
      <div class="form-item">
        <label>确认密码</label>
        <input type="password" name="confirmPassword" placeholder="请再次输入密码" required>
      </div>
      <button type="submit" class="submit-btn">注册</button>
    </form>

    <div class="form-footer">
      已有账号？<a th:href="@{/login}">返回登录</a>
    </div>
  </div>
</div>

<script th:src="@{/js/star-bg.js}"></script>
</body>
</html>
