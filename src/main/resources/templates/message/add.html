<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布留言 - 留言板</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板</div>
        <div class="nav-menu">
            <a th:href="@{/index}">首页广场</a>
            <a th:href="@{/message/list}">我的留言</a>
            <span class="nav-user" th:text="'你好，' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <h1 class="page-title">发布新留言</h1>

        <div class="form-wrapper" style="max-width: 600px; margin: 0 auto;">
            <form th:action="@{/message/add}" method="post">
                <div class="form-group">
                    <label>留言分类</label>
                    <select name="topic">
                        <option value="日常">日常</option>
                        <option value="求助">求助</option>
                        <option value="分享">分享</option>
                    </select>
                    <label>可见范围</label>
                    <div class="visibility-group">
                        <label><input type="radio" name="visibility" value="0" checked> 公开（所有人可见）</label>
                        <label><input type="radio" name="visibility" value="1"> 私有（仅自己可见）</label>
                        <label><input type="radio" name="visibility" value="2"> 指定用户可见</label>
                    </div>
                    <input type="text" name="visibleUsernames" id="visibleUsernames"
                           placeholder="输入用户名，多个用英文逗号分隔" style="display:none; margin-top:8px;">
                </div>
                <div class="form-group">
                    <label>留言内容</label>
                    <textarea name="content" rows="6" required placeholder="请输入留言内容..."></textarea>
                </div>
                <button type="submit" class="form-submit">发布留言</button>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
