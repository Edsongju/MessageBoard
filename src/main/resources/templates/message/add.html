<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布留言 - 留言板</title>
    <link rel="stylesheet" th:href="@{/css/starlight.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板</div>
        <div class="nav-menu">
            <a th:href="@{/index}">首页广场</a>
            <a th:href="@{/message/list}">我的留言</a>
        </div>
        <div class="nav-user-area">
            <span class="nav-user" th:text="'你好，' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <div class="form-wrapper wide">
            <h2>发布新留言</h2>
            <form th:action="@{/message/add}" method="post">
                <div class="form-group">
                    <label>留言分类</label>
                    <select name="topic">
                        <option value="日常">日常</option>
                        <option value="求助">求助</option>
                        <option value="分享">分享</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>可见范围</label>
                    <div class="radio-group">
                        <label class="radio-item">
                            <input type="radio" name="visibility" value="0" checked>
                            <i class="fa-regular fa-circle radio-icon"></i>
                            <i class="fa-solid fa-circle-dot radio-icon checked"></i>
                            <span>公开</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="visibility" value="1">
                            <i class="fa-regular fa-circle radio-icon"></i>
                            <i class="fa-solid fa-circle-dot radio-icon checked"></i>
                            <span>私有</span>
                        </label>
                        <label class="radio-item">
                            <input type="radio" name="visibility" value="2">
                            <i class="fa-regular fa-circle radio-icon"></i>
                            <i class="fa-solid fa-circle-dot radio-icon checked"></i>
                            <span>指定用户</span>
                        </label>
                    </div>
                    <input type="text" name="visibleUsernames" id="visibleUsernames"
                           placeholder="输入用户名，多个用英文逗号分隔"
                           style="display:none; margin-top:8px;">
                </div>

                <div class="form-group">
                    <label>留言内容</label>
                    <textarea name="content" rows="6" required placeholder="请输入留言内容..."></textarea>
                </div>

                <button type="submit" class="form-submit">发布留言</button>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/starlight.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
