<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑留言 - 留言论坛</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<!-- 星空背景 -->
<canvas id="starBg"></canvas>

<div class="navbar">
    <div class="nav-container">
        <div class="nav-logo">💬 留言论坛</div>
        <div class="nav-menu">
            <a th:href="@{/index}">留言广场</a>
            <a th:href="@{/message/list}" class="active">个人中心</a>
        </div>
        <div class="nav-user">
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</div>

<div class="container">
    <div class="main-content">
        <div class="card">
            <div class="card-header">
                <h3>编辑留言</h3>
            </div>
            <div class="card-body">
                <form th:action="@{/message/edit}" method="post">
                    <input type="hidden" name="id" th:value="${message.id}">
                    <div class="form-group">
                        <label>留言内容</label>
                        <textarea name="content" class="form-control" required th:text="${message.content}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <a th:href="@{/message/list}" class="btn btn-default">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/star-bg.js}"></script>
</body>
</html>
