<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑留言 - 留言板</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板</div>
        <div class="nav-menu">
            <a th:href="@{/index}">首页广场</a>
            <a th:href="@{/message/list}">我的留言</a>
            <span class="nav-user" th:text="'你好，' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <h1 class="page-title">编辑留言</h1>

        <div class="form-wrapper" style="max-width: 600px; margin: 0 auto;">
            <form th:action="@{/message/edit}" method="post">
                <input type="hidden" name="id" th:value="${message.id}">

                <!-- 新增：分类选择，支持回显 -->
                <div class="form-group">
                    <label>留言分类</label>
                    <select name="topic">
                        <option value="日常" th:selected="${message.topic == '日常'}">日常</option>
                        <option value="求助" th:selected="${message.topic == '求助'}">求助</option>
                        <option value="分享" th:selected="${message.topic == '分享'}">分享</option>
                    </select>
                    <label>可见范围</label>
                    <div class="visibility-group">
                        <label><input type="radio" name="visibility" value="0" th:checked="${message.visibility == 0}"> 公开（所有人可见）</label>
                        <label><input type="radio" name="visibility" value="1" th:checked="${message.visibility == 1}"> 私有（仅自己可见）</label>
                        <label><input type="radio" name="visibility" value="2" th:checked="${message.visibility == 2}"> 指定用户可见</label>
                    </div>
                    <input type="text" name="visibleUsernames" id="visibleUsernames"
                           th:value="${message.visibleUsernames}"
                           placeholder="输入用户名，多个用英文逗号分隔"
                           th:style="${message.visibility == 2} ? 'display:block; margin-top:8px;' : 'display:none; margin-top:8px;'">
                </div>

                <div class="form-group">
                    <label>留言内容</label>
                    <textarea name="content" rows="6" required
                              th:text="${message.content}"></textarea>
                </div>
                <button type="submit" class="form-submit">保存修改</button>
            </form>
        </div>
    </div>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
