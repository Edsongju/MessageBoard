<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的留言 - 留言板</title>
    <link rel="stylesheet" th:href="@{/css/starlight.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板</div>
        <div class="nav-menu">
            <a th:href="@{/index}">首页广场</a>
            <a th:href="@{/message/list}" class="active">我的留言</a>
            <a th:href="@{/admin/user}" th:if="${session.currentUser.role == 1}">后台管理</a>
        </div>
        <div class="nav-user-area">
            <span class="nav-user" th:text="'你好，' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <div class="page-actions">
            <h1 class="page-title">我的留言</h1>
            <a th:href="@{/message/add}" class="btn btn-primary btn-sm">发布新留言</a>
        </div>

        <div id="myMessageList">
            <div class="empty" th:if="${#lists.isEmpty(list)}">你还没有发布过留言</div>

            <div class="message-card" th:each="item : ${list}">
                <div class="message-header">
                    <div class="message-user">
                        <div class="avatar" th:text="${#strings.substring(item.username,0,1)}"></div>
                        <span class="username" th:text="${item.username}"></span>
                    </div>
                    <span class="message-time"
                          th:text="${#temporals.format(item.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                </div>
                <div class="message-content" th:text="${item.content}"></div>
                <div class="message-footer">
                    <span th:if="${item.topic != null}" th:text="'分类：' + ${item.topic}"></span>
                    <div class="message-actions">
                        <a th:href="@{/message/edit/{id}(id=${item.id})}" class="btn btn-outline btn-sm">编辑</a>
                        <a th:href="@{/message/delete/{id}(id=${item.id})}"
                           class="btn btn-danger btn-sm delete-btn">删除</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/starlight.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
