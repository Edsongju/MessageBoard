<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 后台</title>
    <link rel="stylesheet" th:href="@{/css/starlight.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板后台</div>
        <div class="nav-menu">
            <a th:href="@{/index}">← 返回前台</a>
            <a th:href="@{/admin/user}" class="active">用户管理</a>
            <a th:href="@{/admin/message}">留言管理</a>
            <span class="nav-user" th:text="'管理员：' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <div class="page-actions">
            <h1 class="page-title">用户管理</h1>
            <a th:href="@{/index}" class="btn btn-outline btn-sm">返回首页</a>
        </div>

        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>角色</th>
                <th>注册时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${list}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td>
                    <span class="role-tag admin" th:if="${user.role == 1}">管理员</span>
                    <span class="role-tag user" th:if="${user.role == 0 or user.role == null}">普通用户</span>
                </td>
                <td th:text="${#temporals.format(user.createTime, 'yyyy-MM-dd')}"></td>
                <td>
                    <a th:href="@{/admin/user/setAdmin/{id}(id=${user.id})}"
                       class="btn btn-outline btn-sm"
                       th:if="${user.role != 1}">设为管理员</a>
                    <a th:href="@{/admin/user/delete/{id}(id=${user.id})}"
                       class="btn btn-danger btn-sm delete-btn">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/js/starlight.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
