<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言管理 - 后台</title>
    <link rel="stylesheet" th:href="@{/css/starlight.css}">
    <link rel="stylesheet" th:href="@{/css/common.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <div class="nav-logo">留言板后台</div>
        <div class="nav-menu">
            <a th:href="@{/admin/user}">用户管理</a>
            <a th:href="@{/admin/message}" class="active">留言管理</a>
        </div>
        <div class="nav-user-area">
            <a th:href="@{/index}">← 返回前台</a>
            <span class="nav-user" th:text="'管理员：' + ${session.currentUser.username}"></span>
            <a th:href="@{/logout}">退出</a>
        </div>
    </div>
</nav>

<main class="main">
    <div class="container">
        <div class="page-actions">
            <h1 class="page-title">留言管理</h1>
            <a th:href="@{/index}" class="btn btn-outline btn-sm">返回首页</a>
        </div>

        <form class="search-bar" th:action="@{/admin/message}" method="get">
            <input type="text" name="keyword" placeholder="搜索留言..." th:value="${keyword}">
            <button type="submit" class="btn btn-primary btn-sm">搜索</button>
        </form>

        <table class="admin-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>发布用户</th>
                <th>留言内容</th>
                <th>分类</th>
                <th>置顶状态</th>
                <th>发布时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="msg : ${list}">
                <td th:text="${msg.id}"></td>
                <td th:text="${msg.username}"></td>
                <td th:text="${#strings.abbreviate(msg.content, 30)}"></td>
                <td th:text="${msg.topic}"></td>
                <td>
                    <span th:if="${msg.isTop == 1}">已置顶</span>
                    <span th:if="${msg.isTop == 0 or msg.isTop == null}">未置顶</span>
                </td>
                <td th:text="${#temporals.format(msg.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <a th:href="@{/admin/message/top/{id}(id=${msg.id})}"
                       class="btn btn-outline btn-sm"
                       th:text="${msg.isTop == 1} ? '取消置顶' : '置顶'"></a>
                    <a th:href="@{/admin/message/delete/{id}(id=${msg.id})}"
                       class="btn btn-danger btn-sm delete-btn">删除</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<script th:src="@{/js/starlight.js}"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
